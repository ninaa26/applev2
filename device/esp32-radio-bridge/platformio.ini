; The hub's radio bridge: an ESP32 + SX1262 on the hub Pi's USB (README.md).
; Shares the radio settings and frame layout with the camera firmware (../radio-common).
[platformio]
default_envs = esp32

[env]
platform = espressif32@6.9.0
framework = arduino
lib_deps = jgromes/RadioLib@7.1.2
build_flags = -I${PROJECT_DIR}/../radio-common
monitor_speed = 460800

; Any ESP32 DevKit (ESP32-WROOM-32): the radio on VSPI, pins as the defaults in src/main.cpp.
[env:esp32]
board = esp32dev

; An ESP32-S3 DevKitC: pick free pins and set them here.
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags}
  -DRADIO_SCK=12 -DRADIO_MISO=13 -DRADIO_MOSI=11 -DRADIO_NSS=10
  -DRADIO_RESET=9 -DRADIO_BUSY=8 -DRADIO_DIO1=7
