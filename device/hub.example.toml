# The hub: a Raspberry Pi with no camera, on mains power, that takes photos from the ESP32 cameras in
# Wi-Fi range and sends them to the server (docs/esp32-traps.md). install-hub.sh copies this to
# /etc/sentinel/config.toml. The ESP32 cameras it serves come from the server (dashboard → Set up traps).

# The hub's id and key on the dashboard. Left empty, the hub gets them itself with its pairing code
# (install-hub.sh with no arguments makes one); install-hub.sh <id> <key> <server url> fills them in.
trap_id = ""
api_key = ""
server_url = "http://apple-pi-server:8000"     # the server's Tailscale name, or https://<domain> for a cloud server
data_dir = "/var/lib/sentinel"                 # nodes/<trap_id>/ queues photos until the server has them
timezone = "America/New_York"

[schedule]
# When the ESP32 cameras wake and take a photo. Dusk matters most: moths fly at dusk.
# Every slot costs each camera one wake (about 10 s awake), so fewer slots means longer batteries.
times = ["07:00", "10:00", "13:00", "16:00", "19:30", "22:00"]

[hub]
enabled = true
port = 8080                 # the ESP32's HUB_URL is http://<hub's address>:8080 (10.42.0.1 on the hub's own access point)
node_offset_s = 60          # cameras wake this long after each slot; harmless on an always-on hub
checkin_min = 30            # between photos, cameras check in this often for "Take a photo now" (0: never)

# Only for a hub with no server to ask (bench): list cameras by hand with the key the dashboard showed.
# [hub.nodes.T2]
# api_key = "paste-T2's-key"
