; ESP32-S3 camera trap that uploads through the hub Pi (sentinel_device/gateway.py).
; Board: Freenove-style ESP32-S3 CAM (N8R8: 8 MB flash, 8 MB octal PSRAM, CH343 USB serial).
[env:node]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=1 -DBOARD_HAS_PSRAM
lib_deps = bblanchon/ArduinoJson@7.2.1
; The CH343 USB chip garbles data above 115200 baud on macOS.
upload_speed = 115200
monitor_speed = 115200
