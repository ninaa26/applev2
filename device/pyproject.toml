[project]
name = "sentinel-device"
version = "0.1.0"
description = "Orchard Sentinel trap firmware: wake, photograph the liner, upload, sleep."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "smbus2>=0.4",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.13"]
# Laptops only; on the Pi use apt python3-opencv (seen through --system-site-packages).
bench = ["opencv-python>=4.8"]

[project.scripts]
sentinel-cycle = "sentinel_device.cycle:main"
sentinel-focus-sweep = "sentinel_device.tools.focus_sweep:main"
sentinel-flatfield = "sentinel_device.tools.flatfield:main"
sentinel-camera-bench = "sentinel_device.tools.camera_bench:main"
sentinel-camfeed = "sentinel_device.tools.camfeed:main"
sentinel-gateway = "sentinel_device.gateway:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_device*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Loose to start: no strict mode. Tighten one module at a time with [[tool.mypy.overrides]].
[tool.mypy]
python_version = "3.12"
files = ["sentinel_device"]

# no type stubs for these (and on most machines they aren't installed)
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "picamera2", "picamera2.*", "libcamera", "libcamera.*", "gpiozero", "gpiozero.*", "smbus2", "smbus2.*"]
ignore_missing_imports = true
