<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger Today · Orchard Sentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
/* Ledger A, Today's job. Organised by urgency: the one decision, then the rounds, then what's next.
   Type: Atkinson Hyperlegible (Braille Institute, drawn to stay readable at low vision and in glare)
   for everything; Crimson Pro (ui-ux-pro-max "Academic/Research" pairing) only for the decision line.
   Palette "lichen and apple": lichen-grey ground, spruce ink, apple red only on the job that is due,
   ochre for things to fix. Grid: one 1080px column, main 1fr + rail 340, 24px gap. */
:root{
  --ground:#eff2ec; --surface:#fff; --sunk:#e6eae2; --border:#dde3d9; --rule:#ebeee8; --control:#c9d1c5;
  --ink:#17221b; --muted:#56615a; --grid:#e6eae2; --track:#e3e8df;
  --due:#a3222f; --due-soft:#f8e7e8; --fix:#8a5a12; --fix-soft:#f6edd9; --ok:#2f6e45;
  --cm:#a3222f; --ofm:#3f4a43; --oblr:#8b958e; --other:#c7cec7;
  --r:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.col{max-width:1080px;margin:0 auto;padding:0 24px}
header{height:56px;display:flex;align-items:center;gap:24px}
.mark{display:flex;align-items:center;gap:9px;font-weight:700;text-decoration:none;color:inherit}
header nav{display:flex;gap:2px}
header nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none}
header nav a.on{background:var(--sunk);color:var(--ink)}
header .farm{margin-left:auto;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:8px;border:0;font:700 15px "Atkinson Hyperlegible",sans-serif;cursor:pointer;text-decoration:none;transition:transform 140ms cubic-bezier(.23,1,.32,1),background-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:#fff}.btn.primary:hover{background:#2b382f}
.btn.line{background:var(--surface);border:1px solid var(--control);color:var(--ink)}.btn.line:hover{background:#f6f8f4}
.hello{padding:20px 0 16px;color:var(--muted)}
.hello b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 340px;gap:24px;padding-bottom:56px;align-items:start}
.main,.rail{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.job{padding:24px 26px 22px;border-color:#e9cdd0}
.job .when{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--due);background:var(--due-soft);padding:4px 10px;border-radius:6px;font-size:14px}
.job h1{font:600 34px/1.12 "Crimson Pro",Georgia,serif;margin:12px 0 8px;letter-spacing:-.005em}
.job .where{font-size:17px;margin:0}
.job .why{color:var(--muted);margin:6px 0 18px;font-size:15px;max-width:60ch}
.job .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
h2{font-size:17px;font-weight:700;margin:0}
.sec{padding:18px 22px}
.sec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.sec .hd span{color:var(--muted);font-size:14px}
.next{list-style:none;margin:0;padding:0}
.next li{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--rule)}
.next li:first-child{border-top:0}
.next .d{font-weight:700}
.next .d small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.next .t{display:flex;align-items:center;gap:8px;font-weight:700}
.next .w{color:var(--muted);font-size:14.5px}
.next li.watch .t{font-weight:400}
.next li.first .d{color:var(--due)}
table{width:100%;border-collapse:collapse}
th{font-size:13.5px;font-weight:400;color:var(--muted);text-align:left;padding:6px 0;border-bottom:1px solid var(--rule)}
td{padding:10px 0;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:0}
.n{text-align:right}
.up{color:var(--ink)} .up small{color:var(--muted)}
.rounds{list-style:none;margin:0;padding:0}
.rounds li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--rule)}
.rounds li:first-child{border-top:0}
.rounds input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.rounds label{cursor:pointer;font-weight:700;display:block}
.rounds label .tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--fix);background:var(--fix-soft);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px}
.rounds .d{color:var(--muted);font-size:14.5px}
.rounds li.done label,.rounds li.done .d{text-decoration:line-through;color:var(--muted)}
.cams{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cams b{display:block}
.cams span{color:var(--muted);font-size:14.5px}
details{border-top:1px solid var(--rule);margin-top:12px;padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:14.5px}
summary:hover{color:var(--ink)}
.menu{display:none}
@media (max-width:880px){.grid{grid-template-columns:1fr}.rail{order:-1}.rail .cams-card{order:2}}
@media (max-width:640px){
  .col{padding:0 16px}
  header nav,header .farm{display:none}
  .menu{display:inline-flex;margin-left:auto;width:44px;height:44px;align-items:center;justify-content:center;background:none;border:0}
  .job{padding:20px 18px}
  .job h1{font-size:28px}
  .job .acts .btn{flex:1}
  .sec{padding:16px 18px}
  .next li{grid-template-columns:96px 1fr;gap:12px}
  .main{display:contents}.grid{display:flex;flex-direction:column}
  .job-wrap{order:-2}
}
</style>
</head>
<body>
<header class="col">
  <a class="mark" href="#"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 6.5c-2-1.6-6.5-1.4-7 3.2-.5 4.4 2.8 9 5 9 .9 0 1.3-.5 2-.5s1.1.5 2 .5c2.2 0 5.5-4.6 5-9-.5-4.6-5-4.8-7-3.2Z" fill="#17221b"/><path d="M11 6.5c0-2 .8-3.4 2.4-4" stroke="#17221b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>Orchard Sentinel</a>
  <nav aria-label="Main"><a class="on" href="#">Today</a><a href="#">Blocks</a><a href="#">Traps</a><a href="#">Spray log</a></nav>
  <span class="farm">Lansing Ridge</span>
  <button class="menu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="#17221b" stroke-width="1.7" stroke-linecap="round"/></svg></button>
</header>
<main class="col">
  <p class="hello" id="hello"></p>
  <div class="grid">
    <div class="main">
      <section class="card job job-wrap" aria-labelledby="job-h" id="job"></section>
      <section class="card sec" aria-labelledby="n-h"><div class="hd"><h2 id="n-h">Next three weeks</h2><span>Dates move with the weather</span></div><ul class="next" id="next"></ul></section>
      <section class="card sec" aria-labelledby="c-h">
        <div class="hd"><h2 id="c-h">Moths caught, all traps</h2><span>Confirmed by a person</span></div>
        <table><thead><tr><th>Pest</th><th class="n">Jun 9–15</th><th class="n">Week before</th></tr></thead><tbody id="catch"></tbody></table>
        <details><summary>Show every day for 30 days</summary><div id="chart" style="margin-top:12px"></div></details>
      </section>
    </div>
    <aside class="rail">
      <section class="card sec" aria-labelledby="r-h"><div class="hd"><h2 id="r-h">On your rounds</h2><span id="left"></span></div><ul class="rounds" id="rounds"></ul></section>
      <section class="card sec cams-card" aria-labelledby="k-h"><h2 id="k-h" class="sr">Cameras</h2><div class="cams" id="cams"></div></section>
    </aside>
  </div>
</main>
<script src="data.js"></script><script src="kit.js"></script><script src="ledger.js"></script>
<script>
const { traps, hub, weekday, reporting, LABEL, ago } = OS;
const { jobs, rounds, catchRows, fmt, range } = LG;
const $ = (id) => document.getElementById(id);
const first = jobs[0];
$('hello').innerHTML = `${weekday}. <b>One spray this week</b>, two things to fix on your rounds.`;
$('job').innerHTML = `<span class="when">${fmt(first.date, { weekday: 'long', month: 'long', day: 'numeric' })} · tomorrow</span>
  <h1 id="job-h">Spray for codling moth tomorrow</h1>
  <p class="where"><b>${first.where}.</b> First spray of the season.</p>
  <p class="why">${first.why}</p>${Kit.dd('CM', { compact: true })}
  <div class="acts"><a class="btn primary" href="#">I sprayed, log it</a><a class="btn line" href="#">Why this date</a></div>`;
$('next').innerHTML = jobs.map((j, i) => `<li class="${j.kind}${i === 0 ? ' first' : ''}"><div class="d">${j.end ? range(j.date, j.end) : fmt(j.date, { month: 'short', day: 'numeric' })}<small>${j.end ? 'from ' : ''}${fmt(j.date, { weekday: 'long' })}</small></div><div><div class="t"><i class="dot c-${j.sp}"></i>${j.title}</div><div class="w">${j.where}. ${j.kind === 'watch' ? j.why : ''}</div></div></li>`).join('');
$('catch').innerHTML = catchRows.map((r) => { const d = r.now - r.before; return `<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><i class="dot c-${r.sp}"></i>${LABEL[r.sp]}</span></td><td class="n"><b>${r.now}</b></td><td class="n up">${r.before} <small>(${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d)} this week)</small></td></tr>`; }).join('');
Kit.stack($('chart'), { height: 120, labels: 'weeks' });
const render = () => {
  let done = {}; try { done = JSON.parse(localStorage.getItem('os-rounds') || '{}'); } catch (e) {}
  $('rounds').innerHTML = rounds.map((r) => `<li class="${done[r.id] ? 'done' : ''}"><input type="checkbox" id="${r.id}" ${done[r.id] ? 'checked' : ''}><div><label for="${r.id}">${r.title}${r.level === 'fix' ? '<span class="tag">Fix</span>' : ''}</label><div class="d">${r.detail}</div></div></li>`).join('');
  const left = rounds.filter((r) => !done[r.id]).length;
  $('left').textContent = left ? `${left} left` : 'All done';
};
$('rounds').addEventListener('change', (e) => { let done = {}; try { done = JSON.parse(localStorage.getItem('os-rounds') || '{}'); } catch (x) {} done[e.target.id] = e.target.checked; try { localStorage.setItem('os-rounds', JSON.stringify(done)); } catch (x) {} render(); });
render();
$('cams').innerHTML = `<div><b>${reporting} of ${traps.length} cameras sending</b><span>Hub checked in ${ago(hub.seenMin)}</span></div><a class="btn line" href="#">See traps</a>`;
</script>
</body>
</html>
