<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Orchard Sentinel{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">Orchard Sentinel</a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'overview' }}">Traps</a>
    <a href="/review" class="{{ 'on' if nav == 'review' }}">Review queue</a>
  </nav>
  <span class="muted mono" style="margin-left:auto;font-size:12px">v{{ version }}</span>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
