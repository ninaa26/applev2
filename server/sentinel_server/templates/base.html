<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Orchard Sentinel{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/static/app.css?v={{ CSS_V }}">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<header class="top">
  <div class="in">
    <a class="brand" href="/" aria-label="Orchard Sentinel, the orchard overview">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><path d="M2 20 13 3l11 17z" fill="none" stroke="var(--leaf)" stroke-width="2.4" stroke-linejoin="round"/><path d="M8 20h10" stroke="var(--apple)" stroke-width="2.4" stroke-linecap="round"/></svg>
      Orchard Sentinel
    </a>
    <nav aria-label="Main">
      <a href="/" class="{{ 'on' if nav == 'overview' }}" {{ 'aria-current="page"' if nav == 'overview' }}>Orchard</a>
      <a href="/review" class="{{ 'on' if nav == 'review' }}" {{ 'aria-current="page"' if nav == 'review' }}>Review insects</a>
      <a href="/manage" class="{{ 'on' if nav == 'manage' }}" {{ 'aria-current="page"' if nav == 'manage' }}>Set up traps</a>
    </nav>
    <span class="ver">v{{ version }}</span>
  </div>
</header>
<main id="main">
{% block main %}{% endblock %}
</main>
</body>
</html>
