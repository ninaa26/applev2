name: tests

on:
  push:
    branches: [master]
  pull_request:

# the jobs only read the code
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # settings in ruff.toml; the version is pinned so a new Ruff release can't fail every PR at once
      - run: uvx ruff@0.17.2 check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # mypy settings are in each pyproject.toml ([tool.mypy]); the version comes from uv.lock
      - run: uv sync --locked --python 3.12 --extra dev
        working-directory: server
      - run: uv run --no-sync mypy
        working-directory: server
      # bench adds OpenCV, whose type hints mypy then checks against
      - run: uv sync --locked --python 3.12 --extra dev --extra bench
        working-directory: device
      - run: uv run --no-sync mypy
        working-directory: device

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --locked: fails if uv.lock is out of step with pyproject.toml (run uv lock and commit it)
      - run: uv sync --locked --python 3.12 --extra dev
      - run: uv run --no-sync pytest -q

  device:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # bench adds OpenCV, so the camera-bench tests run instead of being skipped
      - run: uv sync --locked --python 3.12 --extra dev --extra bench
      - run: uv run --no-sync pytest -q

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # the tests need numpy + pillow only, not the torch stack in requirements.txt
      - run: uv run --no-project --python 3.12 --with numpy --with pillow python -m unittest discover tests
