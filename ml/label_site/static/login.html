<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liner labels</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Space+Grotesk:wght@700&display=swap">
<link rel="stylesheet" href="/static/login.css"></head><body>
<form method="post" action="/login">
  <h1><span>Welcome to</span> SORT-A-BUG</h1><p>Orchard Sentinel · log in with the name and password you were sent.</p>
  <label for="name">Name</label><input id="name" name="name" autocomplete="username" autofocus required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <button>Log in</button><div class="msg">__MSG__</div>
</form></body></html>
