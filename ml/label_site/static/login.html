<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liner labels</title><link rel="stylesheet" href="/static/login.css"></head><body>
<form method="post" action="/login">
  <h1>Liner labels</h1><p>Orchard Sentinel · log in with the name and password you were sent.</p>
  <label for="name">Name</label><input id="name" name="name" autocomplete="username" autofocus required>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <button>Log in</button><div class="msg">__MSG__</div>
</form></body></html>
